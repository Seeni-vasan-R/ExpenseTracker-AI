{% load static %}

<!DOCTYPE html>
<html
    lang="en"
    data-theme="light"
    data-currency="{% if request.user.is_authenticated %}{{ request.user.profile.currency|default:'INR' }}{% else %}INR{% endif %}"
>
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
            Expense Tracker
        {% endblock %}
    </title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link
        rel="stylesheet"
        href="{% static 'dashboard/css/dashboard.css' %}"
    >

    {% block extra_css %}{% endblock %}

</head>

<body class="dashboard-body sidebar-collapsed">

    <div class="app-shell">

        {% include "dashboard/components/sidebar.html" %}

        <main class="main-content">

            <div
                class="mobile-overlay"
                id="mobileOverlay"
            ></div>

            {% block content %}{% endblock %}

        </main>

    </div>

    <script
        src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.min.js"
    ></script>

    <script
        src="{% static 'dashboard/js/dashboard.js' %}"
    ></script>

    {% block extra_js %}{% endblock %}

</body>
</html>
