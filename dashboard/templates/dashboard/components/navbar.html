<nav class="top-navbar" aria-label="Dashboard navigation">
    <form
        class="search-box"
        method="get"
        action="{% url 'transactions:transaction_list' %}"
    >
        <label
            for="transaction-search"
            class="visually-hidden"
        >
            Search transactions
        </label>

        <input
            id="transaction-search"
            type="search"
            name="search"
            value="{{ request.GET.search|default:'' }}"
            placeholder="Search transactions..."
            autocomplete="off"
        >

        <button
            type="submit"
            aria-label="Search transactions"
        >
            <i class="fas fa-search" aria-hidden="true"></i>
        </button>
    </form>

    <div class="navbar-right">
        <div class="notification" aria-label="Notifications">
            <i class="fas fa-bell" aria-hidden="true"></i>
        </div>

        <div class="profile">
            <img
                src="https://ui-avatars.com/api/?name={{ request.user.username|urlencode }}&background=4F46E5&color=fff"
                alt="{{ request.user.username }} profile image"
                width="40"
                height="40"
            >

            <div>
                <h6>{{ request.user.username }}</h6>
                <small>Welcome back</small>
            </div>
        </div>
    </div>
</nav>
