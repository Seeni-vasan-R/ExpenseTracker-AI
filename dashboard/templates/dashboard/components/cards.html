<div class="row g-4">
    <div class="col-lg-3 col-md-6">
        <div class="dashboard-card balance-card">
            <div>
                <h6>Current Balance</h6>
                <h2>₹ {{ balance|default:"0.00"|floatformat:2 }}</h2>
            </div>

            <i class="fas fa-wallet" aria-hidden="true"></i>
        </div>
    </div>

    <div class="col-lg-3 col-md-6">
        <div class="dashboard-card income-card">
            <div>
                <h6>Total Income</h6>
                <h2>₹ {{ income|default:"0.00"|floatformat:2 }}</h2>
            </div>

            <i class="fas fa-arrow-trend-up" aria-hidden="true"></i>
        </div>
    </div>

    <div class="col-lg-3 col-md-6">
        <div class="dashboard-card expense-card">
            <div>
                <h6>Total Expense</h6>
                <h2>₹ {{ expense|default:"0.00"|floatformat:2 }}</h2>
            </div>

            <i class="fas fa-arrow-trend-down" aria-hidden="true"></i>
        </div>
    </div>

    <div class="col-lg-3 col-md-6">
        <div class="dashboard-card budget-card">
            <div>
                <h6>Budget</h6>
                <h2>₹ {{ budget_limit|default:"0.00"|floatformat:2 }}</h2>
            </div>

            <i class="fas fa-piggy-bank" aria-hidden="true"></i>
        </div>
    </div>
</div>
