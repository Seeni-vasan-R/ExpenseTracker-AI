<aside
    class="sidebar"
    id="sidebar"
    aria-label="Main sidebar"
>
    <div class="sidebar-brand">
        <a
            href="{% url 'dashboard:dashboard' %}"
            class="brand-link"
            title="Expense Tracker dashboard"
        >
            <span class="brand-mark">E</span>

            <span class="brand-copy">
                <strong>Expense Tracker</strong>
                <small>See your money clearly.</small>
            </span>
        </a>

        <button
            type="button"
            class="sidebar-toggle"
            id="sidebarToggle"
            aria-label="Collapse sidebar"
            title="Collapse sidebar"
        >
            <i class="fa-solid fa-chevron-left"></i>
        </button>
    </div>

    <nav
        class="sidebar-navigation"
        aria-label="Main navigation"
    >
        <p class="navigation-label">
            Workspace
        </p>

        <a
            href="{% url 'dashboard:dashboard' %}"
            class="nav-link {% if request.resolver_match.namespace == 'dashboard' %}active{% endif %}"
            title="Dashboard"
        >
            <i
                class="fa-solid fa-table-cells-large"
                aria-hidden="true"
            ></i>

            <span>Dashboard</span>
        </a>

        <a
            href="{% url 'transactions:transaction_list' %}"
            class="nav-link {% if request.resolver_match.namespace == 'transactions' %}active{% endif %}"
            title="Transactions"
        >
            <i
                class="fa-solid fa-arrow-right-arrow-left"
                aria-hidden="true"
            ></i>

            <span>Transactions</span>
        </a>

        <a
            href="{% url 'budget:budget_list' %}"
            class="nav-link {% if request.resolver_match.namespace == 'budget' %}active{% endif %}"
            title="Budgets"
        >
            <i
                class="fa-solid fa-wallet"
                aria-hidden="true"
            ></i>

            <span>Budgets</span>
        </a>

        <p class="navigation-label navigation-label-secondary">
            Insights
        </p>

        <a
            href="{% url 'analytics:dashboard' %}"
            class="nav-link {% if request.resolver_match.namespace == 'analytics' %}active{% endif %}"
            title="Analysis"
        >
            <i
                class="fa-solid fa-chart-line"
                aria-hidden="true"
            ></i>

            <span>Analysis</span>
        </a>

        <a
            href="{% url 'accounts:profile' %}"
            class="nav-link {% if request.resolver_match.namespace == 'accounts' %}active{% endif %}"
            title="Accounts"
        >
            <i
                class="fa-solid fa-building-columns"
                aria-hidden="true"
            ></i>

            <span>Accounts</span>
        </a>

        <p class="navigation-label navigation-label-secondary">
            Personal
        </p>

        <a
            href="{% url 'accounts:settings' %}"
            class="nav-link {% if request.resolver_match.url_name == 'settings' %}active{% endif %}"
            title="Settings"
        >
            <i
                class="fa-solid fa-sliders"
                aria-hidden="true"
            ></i>

            <span>Settings</span>
        </a>
    </nav>

    <div class="sidebar-bottom">
        <div class="habit-card">
            <i
                class="fa-regular fa-lightbulb"
                aria-hidden="true"
            ></i>

            <div>
                <strong>Smart habit</strong>
                <p>Track every expense consistently.</p>
            </div>
        </div>

        <form
            method="post"
            action="{% url 'accounts:logout' %}"
            class="logout-form"
        >
            {% csrf_token %}

            <button
                type="submit"
                class="logout-link"
                title="Logout"
            >
                <i
                    class="fa-solid fa-arrow-right-from-bracket"
                    aria-hidden="true"
                ></i>

                <span>Logout</span>
            </button>
        </form>
    </div>
</aside>
